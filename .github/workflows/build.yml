name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run compile
      - run: npm test
      - run: npm run zip:all
      - run: ls -la .output/*.zip

      # 构建产物：Actions 运行页底部 Artifacts 区
      - uses: actions/upload-artifact@v7
        with:
          name: apmix-team-assist
          path: .output/*.zip
          if-no-files-found: error

      # 同时发布到 Releases 页的 "latest" 预发布版本，方便直接下载
      - name: Publish latest pre-release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest .output/*.zip \
            --prerelease \
            --title "最新构建 (${GITHUB_SHA::7})" \
            --notes "main 分支自动构建：Chrome / Edge / Firefox (MV3)。解压后在扩展管理页加载。"
