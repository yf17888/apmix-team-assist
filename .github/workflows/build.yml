name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run compile
      - run: npm test
      - run: npm run zip:all
      - uses: actions/upload-artifact@v4
        with:
          name: apmix-team-assist
          path: .output/*.zip
